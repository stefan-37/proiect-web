events {}

http {
    include /etc/nginx/mime.types;

    limit_req_zone $binary_remote_addr zone=mylimit:10m rate=5000000r/m;
    limit_req_zone $binary_remote_addr zone=limit:10m rate=1000000r/m;

    server {
        listen 80;

        root /usr/share/nginx/html;
        index login.html;

        # The backend sets the auth cookie with `Secure; SameSite=None`, intended
        # for a cross-origin HTTPS deployment. This stack is served over plain
        # http://localhost (same-origin), where browsers refuse to send a Secure
        # cookie and reject SameSite=None without Secure. Rewrite the flags on the
        # responses that carry Set-Cookie (login sets it, logout clears it) so the
        # cookie persists across refreshes. (No Go/frontend change.)

        location ~ ^/(user|admin|trainer)/login$ {
            limit_req zone=mylimit burst=10 nodelay;
            proxy_cookie_flags key nosecure samesite=lax;
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location ~ ^/(user|admin|trainer)/ {
            limit_req zone=limit burst=30 nodelay;
            proxy_cookie_flags key nosecure samesite=lax;
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location ~ ^/(subscriptions|classes|personsCount|forgot-password)$ {
            limit_req zone=limit burst=30 nodelay;
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
