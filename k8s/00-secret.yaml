# Replaces the `environment:` secrets from Docker-Compose.yaml.
# In real use, do NOT commit real values — this mirrors backend/.env (key="test").
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
type: Opaque
stringData:
  key: "test"                 # JWT signing secret (read by backend/config/config.go)
  EMAIL: "you@example.com"
  EMAIL_PASSWORD: "changeme"
  POSTGRES_PASSWORD: "password"
