# nginx front door — kept as-is from Compose rather than swapping to an Ingress,
# because nginx.conf does app-specific work (cookie-flag rewriting + rate limiting)
# that would have to be re-expressed as ingress annotations. The config lives in a
# ConfigMap; exposed to your host via a NodePort.
#
# NOTE on static frontend: Compose bind-mounted ../../frontend/FrontEnd as the web
# root. Those files are not on disk in this branch, so the `location /` block will
# 404 — but every /user /admin /trainer /subscriptions /classes API route still
# proxies to the backend correctly. To serve the UI, restore the frontend files and
# either bake them into a custom nginx image or mount them via another ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-conf
data:
  nginx.conf: |
    events {}

    http {
        include /etc/nginx/mime.types;

        limit_req_zone $binary_remote_addr zone=mylimit:10m rate=5000000r/m;
        limit_req_zone $binary_remote_addr zone=limit:10m rate=1000000r/m;

        server {
            listen 80;

            root /usr/share/nginx/html;
            index login.html;

            location ~ ^/(user|admin|trainer)/login$ {
                limit_req zone=mylimit burst=10 nodelay;
                proxy_cookie_flags key nosecure samesite=lax;
                proxy_pass http://backend:8080;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
            }

            location ~ ^/(user|admin|trainer)/ {
                limit_req zone=limit burst=30 nodelay;
                proxy_cookie_flags key nosecure samesite=lax;
                proxy_pass http://backend:8080;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
            }

            location ~ ^/(subscriptions|classes|personsCount|forgot-password)$ {
                limit_req zone=limit burst=30 nodelay;
                proxy_pass http://backend:8080;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
            }

            location / {
                try_files $uri $uri/ =404;
            }
        }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
spec:
  type: NodePort            # exposes the stack to your host (like Compose's "80:80")
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080       # reach it via the cluster node IP on :30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
          readinessProbe:                # TCP, not httpGet: "/" 404s without the
            tcpSocket:                    # frontend, which would fail an http probe
              port: 80
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:                 # restarts nginx if it stops listening
            tcpSocket:
              port: 80
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: conf
          configMap:
            name: nginx-conf
